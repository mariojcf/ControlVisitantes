<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Visitantes - UMES</title>
    <style>
        :root {
            --umes-green: #044b33;
            --umes-light: #f4f7f6;
            --umes-border: #d1d5db;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--umes-light);
            color: #333;
        }
        header {
            background-color: var(--umes-green);
            padding: 15px 30px;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: var(--umes-green);
            border-bottom: 2px solid var(--umes-green);
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-indicator {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background-color: #ffc107;
            color: #000;
        }
        .status-indicator.online {
            background-color: #28a745;
            color: white;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid var(--umes-border);
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--umes-green);
        }
        button {
            background-color: var(--umes-green);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #033624;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .btn-export {
            background-color: #1d6f42;
        }
        .btn-export:hover {
            background-color: #144c2d;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 6px 12px;
            font-size: 13px;
        }
        .btn-delete:hover {
            background-color: #bb2d3b;
        }
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 15px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--umes-border);
            flex-wrap: wrap;
            gap: 10px;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid var(--umes-border);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--umes-green);
            color: white;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #fcfcfc;
        }
        tr:hover {
            background-color: #f1f1f1;
        }

        /* Custom Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-box h3 {
            margin-top: 0;
            color: var(--umes-green);
        }
        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-cancel {
            background-color: #6c757d;
        }
        .btn-cancel:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <header>
        <h1>Registro y Control de Visitantes</h1>
    </header>
    <div class="container">
        <h2>
            Ingreso de Nueva Visita
        </h2>
        <form id="formVisitantes">
            <div class="form-grid">
                <!-- Nuevo campo de Recepcionista -->
                <div class="form-group">
                    <label for="recepcionista">Recepcionista en turno</label>
                    <select id="recepcionista" required>
                        <option value="" disabled selected>Seleccione...</option>
                        <option value="Recepcionista 1">Brenda</option>
                        <option value="Recepcionista 2">Andrea</option>
                        <option value="Recepcionista 3">Mario</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" required>
                </div>
                <div class="form-group">
                    <label for="nombres">Nombres del Visitante</label>
                    <input type="text" id="nombres" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label for="consulta">Consulta / Trámite</label>
                    <input type="text" id="consulta" placeholder="Ej. Entrega de papelería" required>
                </div>
                <div class="form-group">
                    <label for="ubicacion">Ubicación / Destino</label>
                    <input type="text" id="ubicacion" placeholder="Ej. Recepción / Contabilidad" required>
                </div>
            </div>
            <button type="submit" id="btnGuardar">Guardar Registro</button>
        </form>

        <div class="table-controls">
            <div class="filter-group">
                <label for="filtroMes"><strong>Ver registros de:</strong></label>
                <input type="month" id="filtroMes">
                <button type="button" id="btnLimpiar" style="background-color: #6c757d;">Mostrar Todos</button>
            </div>
            <button type="button" id="btnExportar" class="btn-export">📊 Exportar a Excel</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Hora</th>
                        <th>Fecha</th>
                        <th>Visitante</th>
                        <th>Consulta</th>
                        <th>Ubicación</th>
                        <th>Recepcionista</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Los datos se inyectarán mediante JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Eliminar Registro</h3>
            <p>¿Estás seguro de que deseas eliminar este registro de visitante? Esta acción no se puede deshacer y se borrará para todos los recepcionistas.</p>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btnCancelDelete">Cancelar</button>
                <button type="button" class="btn-delete" id="btnConfirmDelete">Sí, Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script>
        // Inicializar almacenamiento local
        let registros = JSON.parse(localStorage.getItem('umes_registros_visitas_local')) || [];
        let registroAEliminar = null;
        const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

        // Elementos del DOM
        const form = document.getElementById('formVisitantes');
        const cuerpoTabla = document.getElementById('cuerpoTabla');
        const filtroMes = document.getElementById('filtroMes');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const btnExportar = document.getElementById('btnExportar');

        // Elementos del Modal
        const deleteModal = document.getElementById('deleteModal');
        const btnCancelDelete = document.getElementById('btnCancelDelete');
        const btnConfirmDelete = document.getElementById('btnConfirmDelete');

        // Configurar el mes actual por defecto al cargar
        const fechaActual = new Date();
        const mesActualFormato = fechaActual.getFullYear() + '-' + String(fechaActual.getMonth() + 1).padStart(2, '0');
        filtroMes.value = mesActualFormato;

        // Establecer fecha actual en el input del formulario para ahorrar tiempo
        const diaActualFormato = fechaActual.getFullYear() + '-' + String(fechaActual.getMonth() + 1).padStart(2, '0') + '-' + String(fechaActual.getDate()).padStart(2, '0');
        document.getElementById('fecha').value = diaActualFormato;

        // Formatear hora actual (HH:MM)
        const horaActual = String(fechaActual.getHours()).padStart(2, '0') + ':' + String(fechaActual.getMinutes()).padStart(2, '0');
        document.getElementById('hora').value = horaActual;

        function obtenerNombreDia(fechaString) {
            const fecha = new Date(fechaString + 'T12:00:00');
            return diasSemana[fecha.getDay()];
        }

        function formatearFechaVisual(fechaString) {
            const partes = fechaString.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function actualizarTabla() {
            cuerpoTabla.innerHTML = '';
            const filtro = filtroMes.value;

            // Ordenar de más reciente a más antiguo
            const registrosOrdenados = [...registros].sort((a, b) => {
                const fechaA = new Date(`${a.fecha}T${a.hora}`);
                const fechaB = new Date(`${b.fecha}T${b.hora}`);
                return fechaB - fechaA;
            });

            const registrosFiltrados = registrosOrdenados.filter((registro) => {
                const mesRegistro = registro.fecha.substring(0, 7);
                if (filtro && filtro !== mesRegistro) return false;
                return true;
            });

            if (registrosFiltrados.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="8" style="text-align: center;">No hay registros para el mes seleccionado</td></tr>`;
                return;
            }

            registrosFiltrados.forEach((registro) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${registro.dia}</td>
                    <td>${registro.hora}</td>
                    <td>${formatearFechaVisual(registro.fecha)}</td>
                    <td>${registro.nombres}</td>
                    <td>${registro.consulta}</td>
                    <td>${registro.ubicacion}</td>
                    <td><strong>${registro.recepcionista || 'N/A'}</strong></td>
                    <td><button class="btn-delete" data-id="${registro.id}">Eliminar</button></td>
                `;
                cuerpoTabla.appendChild(tr);
            });

            // Asignar eventos de eliminar
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) confirmarEliminacion(id);
                });
            });
        }

        // --- Guardar Datos ---
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const fechaInput = document.getElementById('fecha').value;

            const nuevoRegistro = {
                id: Date.now().toString(),
                recepcionista: document.getElementById('recepcionista').value,
                dia: obtenerNombreDia(fechaInput),
                fecha: fechaInput,
                hora: document.getElementById('hora').value,
                nombres: document.getElementById('nombres').value,
                consulta: document.getElementById('consulta').value,
                ubicacion: document.getElementById('ubicacion').value
            };

            registros.push(nuevoRegistro);
            localStorage.setItem('umes_registros_visitas_local', JSON.stringify(registros));

            // Reiniciar solo campos de texto, dejar fecha/hora/recepcionista
            document.getElementById('nombres').value = '';
            document.getElementById('consulta').value = '';
            document.getElementById('ubicacion').value = '';

            actualizarTabla();
        });

        // --- Sistema de Modal para Eliminar ---
        function confirmarEliminacion(id) {
            registroAEliminar = id;
            deleteModal.style.display = 'flex';
        }

        btnCancelDelete.addEventListener('click', () => {
            registroAEliminar = null;
            deleteModal.style.display = 'none';
        });

        btnConfirmDelete.addEventListener('click', () => {
            if (registroAEliminar) {
                registros = registros.filter(r => r.id !== registroAEliminar);
                localStorage.setItem('umes_registros_visitas_local', JSON.stringify(registros));
                actualizarTabla();

                registroAEliminar = null;
                deleteModal.style.display = 'none';
            }
        });

        // --- Eventos de filtrado ---
        filtroMes.addEventListener('change', actualizarTabla);
        btnLimpiar.addEventListener('click', () => {
            filtroMes.value = '';
            actualizarTabla();
        });

        // --- Exportar a Excel (CSV) ---
        btnExportar.addEventListener('click', function() {
            const filtro = filtroMes.value;
            let datosExportar = registros;

            if (filtro) {
                datosExportar = registros.filter(r => r.fecha.substring(0, 7) === filtro);
            }

            if(datosExportar.length === 0) {
                const originalText = btnExportar.textContent;
                btnExportar.textContent = '⚠️ Sin datos';
                btnExportar.style.backgroundColor = '#dc3545';
                setTimeout(() => {
                    btnExportar.textContent = originalText;
                    btnExportar.style.backgroundColor = '';
                }, 3000);
                return;
            }

            let csvContent = "Día,Hora,Fecha,Nombres,Consulta,Ubicación,Recepcionista\n";

            // Ordenar para exportar
            datosExportar.sort((a, b) => {
                return new Date(`${b.fecha}T${b.hora}`) - new Date(`${a.fecha}T${a.hora}`);
            });

            datosExportar.forEach(r => {
                const fila = [
                    r.dia,
                    r.hora,
                    formatearFechaVisual(r.fecha),
                    `"${(r.nombres || '').replace(/"/g, '""')}"`,
                    `"${(r.consulta || '').replace(/"/g, '""')}"`,
                    `"${(r.ubicacion || '').replace(/"/g, '""')}"`,
                    `"${(r.recepcionista || '').replace(/"/g, '""')}"`
                ];
                csvContent += fila.join(",") + "\n";
            });

            const BOM = "\uFEFF";
            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Reporte_Visitas_UMES_${filtro || 'Historico'}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Carga inicial
        actualizarTabla();
    </script>
</body>
</html>
